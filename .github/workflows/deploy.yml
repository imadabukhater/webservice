name: Build & Deploy

on:
  push:
    branches: [ccr-ab68d4af-p55geh]
    paths: [agents-app/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd agents-app && npm install && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/ccr-ab68d4af-p55geh'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl "$RENDER_DEPLOY_HOOK"
          else
            echo "⚠️  اضبط RENDER_DEPLOY_HOOK في GitHub Secrets"
          fi
