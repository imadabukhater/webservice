<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181514"/>
      <stop offset="55%" stop-color="#231c1b"/>
      <stop offset="100%" stop-color="#2c181b"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.2" cy="0.85" r="0.65">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="simBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="hChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowCyan)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowGold)"/>

  <!-- Outer Chamfered SIM Card Frame -->
  <path d="M148 76 H308 L392 160 V396 A40 40 0 0 1 352 436 H148 A40 40 0 0 1 108 396 V116 A40 40 0 0 1 148 76 Z"
        fill="#1c1917" fill-opacity="0.85" stroke="url(#simBody)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Subtle SIM Corner Notch Accent Line -->
  <path d="M302 82 V146 A20 20 0 0 0 322 166 H386" fill="none" stroke="#fda4af" stroke-width="10" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- H-Shaped Metallic SIM Chip Contact Pad -->
  <g fill="url(#hChip)">
    <!-- Left Vertical Pillar of H -->
    <rect x="158" y="156" width="56" height="208" rx="18"/>
    <!-- Right Vertical Pillar of H (with chamfered top-right SIM cut) -->
    <path d="M286 156 H318 L342 180 V346 A18 18 0 0 1 324 364 H286 A18 18 0 0 1 268 346 V174 A18 18 0 0 1 286 156 Z"/>
    <!-- Center Horizontal Bridge of H -->
    <rect x="204" y="232" width="92" height="56" rx="12"/>
  </g>

  <!-- Authentic SIM Chip Contact Grooves on the H -->
  <g stroke="#78350f" stroke-width="8" stroke-opacity="0.55" stroke-linecap="round">
    <line x1="162" y1="212" x2="210" y2="212"/>
    <line x1="162" y1="308" x2="210" y2="308"/>
    <line x1="272" y1="212" x2="338" y2="212"/>
    <line x1="272" y1="308" x2="338" y2="308"/>
  </g>

  <!-- Warm eSIM Core Node in the Center of the H -->
  <circle cx="250" cy="260" r="14" fill="#181514"/>
  <circle cx="250" cy="260" r="7" fill="#f43f5e"/>
</svg>
