<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="h-heat" gradientUnits="userSpaceOnUse" x1="0" y1="216" x2="0" y2="20">
      <stop offset="0" stop-color="#E0123E"/>
      <stop offset="0.55" stop-color="#FF4A1F"/>
      <stop offset="1" stop-color="#FFB21E"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="54" fill="#1A1325"/>
  <g transform="translate(120 120) scale(0.78) translate(-120 -118)">
    <!-- H-shaped SIM card body (notched top-right corner) -->
    <path d="M62 52
             L80 52 Q88 52 88 60
             L88 96 Q88 104 96 104
             L144 104 Q152 104 152 96
             L152 60 Q152 52 160 52
             L168 52 L194 78
             L194 200 Q194 216 178 216
             L160 216 Q152 216 152 208
             L152 184 Q152 176 144 176
             L96 176 Q88 176 88 184
             L88 208 Q88 216 80 216
             L62 216 Q46 216 46 200
             L46 68 Q46 52 62 52 Z" fill="url(#h-heat)"/>
    <!-- Gold SIM contact chip IS the crossbar of the H -->
    <rect x="88" y="116" width="64" height="48" rx="10" fill="#FFF1DC"/>
    <g stroke="#F0302F" stroke-width="4">
      <line x1="109.3" y1="116" x2="109.3" y2="164"/>
      <line x1="130.7" y1="116" x2="130.7" y2="164"/>
      <line x1="88" y1="140" x2="152" y2="140"/>
    </g>
    <!-- Flame rising from the top notch of the H -->
    <path d="M120 98
             C106.7 98 97.2 87.6 97.2 73.3
             C97.2 58.1 108.6 48.6 114.3 39.1
             C118.1 33.4 121 27.7 121.9 20.1
             C133.3 31.5 142.8 48.6 142.8 69.5
             C142.8 86.6 133.3 98 120 98 Z" fill="url(#h-heat)"/>
    <!-- Hot inner core -->
    <path d="M0 -8 C-8 -8 -12 -14 -12 -23 C-12 -33 -5 -39 1 -50 C7 -41 12 -33 12 -23 C12 -14 8 -8 0 -8 Z"
          transform="translate(120 98) scale(0.95)" fill="#FFE58A"/>
  </g>
</svg>
