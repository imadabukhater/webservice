services:
  - type: web
    name: agents-app
    runtime: node
    plan: free
    rootDir: agents-app
    buildCommand: npm install
    startCommand: ADMIN_PASSWORD=$ADMIN_PASSWORD node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      - name: data
        mountPath: /data
        sizeGB: 1
